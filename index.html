<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6ecdf">
<title>测你的专属城市 CP</title>
<style>:root{color-scheme:light;--paper:#e6ecdf;--ink:#172d25;--muted:#4b6256;--line:#aebead;--deep:#183b2f;--white:#f7f9f2;--orange:#a84927;--serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,serif;--sans:"Inter","PingFang SC","Microsoft YaHei",sans-serif;font-family:var(--sans);background:var(--paper);color:var(--ink)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-width:280px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button[hidden], [hidden]{display:none!important}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
button:disabled{cursor:default;opacity:.45}
h1,h2,h3,p,figure{margin:0}
.mast{height:66px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 clamp(18px,5vw,68px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.13em;font-size:14px}
.brand i{width:19px;height:19px;background:var(--deep);border-radius:50%;position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border:1px solid var(--paper);border-radius:50%;border-bottom-color:transparent;transform:rotate(-32deg)}
.cover{max-width:1140px;margin:auto;min-height:calc(100svh - 66px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,7vw,104px);align-items:center;padding:38px clamp(24px,5vw,68px) 58px}
.cover h1{font-family:var(--serif);font-size:clamp(50px,7vw,100px);line-height:1.02;letter-spacing:-.065em;margin:14px 0 21px}
.cover h1 em{font-weight:normal;color:var(--orange);font-family:Georgia,serif}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.11em;font-weight:650}
.intro{font-size:clamp(17px,2vw,21px);line-height:1.65;margin-bottom:26px}
.cover-image{position:relative}
.cover-image img{width:100%;height:min(61vh,540px);object-fit:cover;border-radius:180px 180px 13px 13px;display:block;background:#94aa8b}
.cover-image figcaption{position:absolute;bottom:14px;left:14px;background:#ebeee2;color:#20362b;padding:7px 10px;font-size:11px;border-radius:3px}
.primary,.secondary,.plain{min-height:44px;border-radius:7px;padding:11px 16px;font-weight:650}
.primary{border:1px solid var(--deep);background:var(--deep);color:white}
.primary span{margin-left:28px}
.secondary{background:transparent;border:1px solid var(--line)}
.plain{background:transparent;border:0;text-decoration:underline;text-underline-offset:4px}
.small{font-size:13px;line-height:1.6;color:var(--muted);margin-top:10px}
.page{width:min(100%,670px);margin:0 auto;padding:24px clamp(16px,5vw,38px) max(24px,env(safe-area-inset-bottom))}
.quiz-meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);gap:14px}
progress{display:block;width:100%;height:6px;margin:9px 0 18px;border:none;background:#c6d3c3;border-radius:8px;overflow:hidden;accent-color:var(--deep)}
progress::-webkit-progress-bar{background:#c6d3c3}progress::-webkit-progress-value{background:var(--deep)}
.page h1{font-family:var(--serif);font-size:clamp(23px,5.2vw,35px);line-height:1.42;margin:10px 0 17px}
[tabindex="-1"]:focus{outline:none}
.option-list{display:grid;gap:8px}
.option{border:1px solid var(--line);background:var(--white);text-align:left;border-radius:8px;min-height:50px;padding:10px 13px;line-height:1.45;display:flex;align-items:center;gap:10px}
.option:last-child{background:transparent}
.option::before{content:"";border:1px solid #779080;width:17px;height:17px;border-radius:50%;flex:none}
.option[aria-pressed="true"]{background:#d0e2cc;border-color:var(--deep);box-shadow:inset 0 0 0 1px var(--deep)}
.option[aria-pressed="true"]::before{background:var(--deep);box-shadow:inset 0 0 0 3px #d0e2cc}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .primary{min-width:128px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:18px 0}
.grid button{height:44px;padding:0;background:var(--white);border:1px solid var(--line);border-radius:6px}
.grid button[data-status="已答"]{background:#d0e2cc}.grid button[data-status="已跳过"]{border-style:dashed;color:var(--muted)}
.result.page{padding-top:30px}
.ticket{background:var(--deep);color:#f2f5e9;padding:clamp(18px,5vw,34px);border-radius:12px;position:relative;overflow:hidden}
.ticket .eyebrow{color:#c9ddcb}
.ticket h1{font-size:clamp(32px,8vw,56px);margin:5px 0 19px}
.ticket h2,.panel h2{font-size:14px;letter-spacing:.09em;margin-bottom:7px}
.ticket p:last-child,.panel p,.panel li{line-height:1.72}
.ticket{padding:0;background:#19382f}
.ticket-head{padding:18px clamp(16px,4vw,28px) 12px}
.ticket .ticket-head h1{margin:3px 0 0}
.art-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(125px,100%),1fr));gap:2px;background:#19382f}
.art-tile{position:relative;overflow:hidden;aspect-ratio:1.72;background:#aabda4}
.art-tile img{display:block;position:absolute;width:200%;height:200%;max-width:none;top:calc(var(--row)*-100%);left:calc(var(--column)*-100%);object-fit:fill}
.art-tile figcaption{position:absolute;bottom:8px;left:8px;background:#f7f9f2ed;color:#19382f;font-weight:650;font-size:11px;padding:5px 7px;border-radius:3px}
.ticket-conclusion{padding:19px clamp(16px,4vw,28px) 23px;background:#f7f4e8;color:var(--ink)}
.ticket-conclusion h2{color:#536252;font-size:12px}
.ticket-conclusion p{font-family:var(--serif);font-weight:600;font-size:clamp(19px,4.8vw,27px);line-height:1.58}
.panel{padding:19px 0;border-bottom:1px solid var(--line)}
.panel h3{font-size:16px;margin:10px 0 4px}
.panel ul{margin:5px 0;padding-left:1.2em}
.panel .boundary{color:var(--muted);font-size:14px;margin-top:7px}
dialog{border:1px solid var(--line);border-radius:13px;padding:15px;background:var(--white);color:var(--ink);width:min(92vw,470px);max-height:90svh}
dialog::backdrop{background:#142a21b3}
.dialog-head,.share-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
#card{display:block;width:100%;max-height:59svh;object-fit:contain;margin:4px auto 12px}
@media(max-width:670px){.mast{height:53px}.cover{min-height:0;grid-template-columns:1fr;gap:18px;padding:22px 22px 23px}.cover-copy{display:contents}.cover .eyebrow{grid-row:1}.cover h1{grid-row:2;margin:0}.intro{grid-row:3;margin:0}.cover-image{grid-row:4}.cover-image img{height:clamp(145px,29svh,250px);border-radius:90px 90px 9px 9px;object-position:center 53%}.cover .primary{grid-row:5}.cover .small{margin:-10px 0 0;text-align:center}.page{padding-top:18px}}
@media(max-width:360px){.grid{grid-template-columns:repeat(6,1fr)}.cover h1{font-size:47px}}
</style>
</head>

<script>"use strict";

const LEVELS = [0, 33, 67, 100];
const KEY = "city-cp-001-v6.1";
const app = document.querySelector("#app");
const topAction = document.querySelector("#top-action");
const dialog = document.querySelector("#share");
const byId = id => document.getElementById(id);
const artwork = {
  SH: {column:0,row:0,caption:"上海 · 西岸示意"},
  SZ: {column:1,row:0,caption:"深圳 · 景田示意"},
  CD: {column:1,row:1,caption:"成都 · 人民公园示意"},
  profile: {column:0,row:1,caption:"普通下午 · 场景示意"}
};
const resultArtwork = top => top.length ? top.map(r=>artwork[r.scene.city_id] ?? artwork.profile) : [artwork.profile];
const escapeHtml = value => String(value).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
));
const blank = () => ({answers: Array(40).fill(null), index: 0, screen: "home"});
let state = blank();
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.answers) && saved.answers.length === 40 &&
      saved.answers.every(a => a === null || Number.isInteger(a) && a >= 0 && a <= 4) &&
      Number.isInteger(saved.index) && saved.index >= 0 && saved.index < 40) {
    state = {...saved, screen:"home"};
  }
} catch {}
let editing = false;
let shareBlob = null;
let shareUrl = null;
let shareTrigger = null;
const count = () => state.answers.filter(a => a !== null).length;
const pad = n => String(n).padStart(2, "0");
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

function profile(answers) {
  return DATA.names.map((_, axis) => {
    const recent = [0, 6, 12, 18, 24].map(offset => LEVELS[answers[offset + axis] ?? 4])
      .filter(value => value !== undefined).sort((a,b) => a-b);
    const low = recent.filter(value => value <= 33).length;
    const split = low >= 2 && recent.length-low >= 2 && recent.at(-1)-recent[0] >= 66;
    const middle = Math.floor(recent.length/2);
    const usual = recent.length < 3 || split ? null :
      (recent[middle]+recent[Math.floor((recent.length-1)/2)])/2;
    const items = [30+axis,36+axis].filter(i => i < 40 && answers[i] < 4 && answers[i] !== null)
      .map(i => ({number:i, value:LEVELS[answers[i]]}));
    if (items.length === 2 && Math.abs(items[0].value-items[1].value) >= 66) {
      return {target:null, usual, weight:0, basis:"split", items};
    }
    if (items.length) {
      return {target:items.reduce((sum,q)=>sum+q.value,0)/items.length,
        usual, weight:items.length === 2 ? 5 : 4, basis:"wish", items};
    }
    return {target:usual, usual, weight:usual === null ? 0 : 3, basis:"usual", items};
  });
}

function match(answers, scenes = DATA.scenes) {
  const axes = profile(answers);
  const active = axes.map((a,i)=>i).filter(i=>axes[i].target !== null);
  const wishes = active.filter(i=>axes[i].basis === "wish");
  const eligible = active.length >= 4 && wishes.length >= 2;
  const rows = scenes.map(scene => {
    let overtime = false;
    const distances = Array(6).fill(null);
    const levels = Array(6).fill(null);
    for (const i of active) {
      const menu = scene.levels[i];
      if (!menu.length) continue;
      const target = axes[i].target;
      const allowed = i === 5 ? menu.filter(level=>level<=target) : menu;
      if (!allowed.length) {
        overtime = true;
        distances[i] = 100;
        continue;
      }
      levels[i] = allowed.reduce((best, level) =>
        Math.abs(target-level) < Math.abs(target-best) ? level : best);
      distances[i] = Math.abs(target-levels[i]);
    }
    const known = active.filter(i=>distances[i] !== null);
    const hits = known.filter(i=>distances[i]<=17 && scene.facts[i]);
    const maxWish = Math.max(0,...wishes.map(i=>distances[i] ?? 0));
    const maxKnown = Math.max(0,...known.map(i=>distances[i]));
    const denom = active.reduce((sum,i)=>sum+axes[i].weight,0);
    const numer = known.reduce((sum,i)=>sum+axes[i].weight*distances[i],0);
    const full = denom > 0 && known.length === active.length;
    const allowed = eligible && scene.current && !overtime && maxWish < 50;
    const leads = allowed && hits.length >= 2 && hits.some(i=>wishes.includes(i));
    return {scene, distances, levels, hits, known, maxWish, maxKnown, numer, denom,
      loss:full ? numer/denom : null,
      formal:allowed && full && numer<=22*denom && hits.length>=2,
      explore:leads && known.length>=3, local:leads && known.length===2};
  });
  const cmp = (a,b)=>a<b ? -1 : a>b ? 1 : 0;
  const cityOrder = (a,b)=>cmp(a.scene.city_id,b.scene.city_id)||cmp(a.scene.id,b.scene.id);
  const uniqueCities = list => list.filter((row,i)=>list.findIndex(r=>r.scene.city_id===row.scene.city_id)===i);
  const formal = uniqueCities(rows.filter(r=>r.formal).sort((a,b)=>
    a.numer-b.numer || a.maxWish-b.maxWish || b.hits.length-a.hits.length || cityOrder(a,b)));
  const local = uniqueCities(rows.filter(r=>r.local).sort(cityOrder));
  const gap = row => row.numer-formal[0].numer;
  if (formal.length) {
    const top = formal.filter(r=>gap(r)<=5*r.denom);
    const alternatives = formal.slice(top.length).filter(r=>gap(r)<=10*r.denom &&
      r.scene.levels.some((menu,i)=>menu.length && formal[0].scene.levels[i].length &&
        menu.join()!==formal[0].scene.levels[i].join()));
    return {axes,active,wishes,eligible,rows,top,local,alternatives,
      branch:top.length===1 ? "正式城市 CP" : top.length===2 ? "双城并列" : "多城并列"};
  }
  const top = uniqueCities(rows.filter(r=>r.explore).sort((a,b)=>b.hits.length-a.hits.length ||
    b.known.length-a.known.length || a.maxKnown-b.maxKnown || cityOrder(a,b))).slice(0,2);
  return {axes,active,wishes,eligible,rows,top,local,alternatives:[],
    branch:top.length ? "探索线索" : "只有生活画像"};
}

function preference(axis, i) {
  const values = [...new Set(axis.items.map(q=>q.value))].sort((a,b)=>a-b);
  const wording = value => DATA.preferences[i][LEVELS.indexOf(value)];
  if (values.length > 1) return "看情况选择「"+values.map(wording).join("」或「")+"」";
  return wording(values[0] ?? axis.target) ?? "按场合决定"+DATA.names[i];
}

function resultContent(result) {
  const {axes,active,top,branch} = result;
  const common = top.length ? top[0].hits.filter(i=>top.every(r=>r.hits.includes(i))) : [];
  const choices = common.length >= 2 ? common : active;
  const changed = i=>axes[i].basis==="wish" && axes[i].usual!==null &&
    Math.abs(axes[i].target-axes[i].usual)>=34;
  const priority = i=>Number(axes[i].basis!=="wish")*100+Number(!changed(i))*10+i;
  const seeds = [...choices].sort((a,b)=>priority(a)-priority(b)).slice(0,2);
  const wants = i=>preference(axes[i],i);
  let conclusion;
  if (choices.includes(0) && choices.includes(2) && axes[0].target===33 && axes[2].target===0) {
    conclusion = "只给自己定一件事的话，你愿意把它留给一个熟去处。知道到了能做什么，这段空闲就有了着落。";
  } else if (choices.includes(0) && choices.includes(2) && axes[0].target===67 && axes[2].target===67) {
    conclusion = axes[0].usual===33 && axes[2].usual===0 ?
      "过去常去一个熟地方，做完一件事就收。这回你想给自己定两站，熟的一站还在，另一站可以留给没去过的地方。" :
      "你想给下午定两站。多出门几次时，熟处还可以回去，其中一站也可以换到没去过的地方。";
  } else if (choices.includes(0) && choices.includes(5) && axes[0].target===33 && axes[5].target>=67) {
    conclusion = "出门先定一件事就够了。回程不赶的时候，你还想"+wants(5)+"，把空闲留一段给路上。";
  } else if (choices.includes(3) && choices.includes(4) && axes[3].target===0 && axes[4].target===100) {
    conclusion = "你想找个安静的位置，把一段自己的事做完。做完兴致还在，你希望能再坐一会儿，自己决定什么时候收尾。";
  } else if (seeds.length) {
    conclusion = seeds.map((i,n)=>{
      const usual = DATA.preferences[i][LEVELS.indexOf(axes[i].usual)];
      return changed(i) && usual ? "平时你多半会"+usual+"，这次想"+wants(i)+"。" :
        (axes[i].basis==="usual" ? "按你平时的做法，你倾向于" : n ? "你也希望" : "这次你想")+wants(i)+"。";
    }).join("");
  } else {
    conclusion = "这份答卷暂时还没有形成可比较的生活偏好。";
  }
  if (axes[5].basis==="wish" && !seeds.includes(5) &&
      (branch==="探索线索" && axes[5].target>=67 || top.length && axes[5].target===33 && top.every(r=>r.levels[5]===0))) {
    conclusion += "回程不赶时，你还想"+wants(5)+"。";
  }
  for (const [i,axis] of axes.entries()) {
    if (axis.basis==="split") {
      conclusion += DATA.names[i]+"要看场合。"+axis.items.map(item=>
        "第 "+(item.number+1)+" 题你选了「"+DATA.questions[item.number].options[LEVELS.indexOf(item.value)]+"」").join("，")+"。";
    }
  }
  const suggestions = ["先给一个空闲下午留出你想做的事","找一处可以自由选择旁观或参与的公共空间",
    "找一个愿意回访的据点，再留一个下次可换的去处","在想坐的地方停一会儿，留意身边的背景声",
    "在有空座的地方试着按自己的节奏做完一件小事","找一段同时有直路和风景支路的回程"];
  const story = top.length ? top[0].scene.story :
    seeds.length ? "你可以试着"+seeds.map(i=>suggestions[i]).join("，也可以")+"。" :
      "想象一个有空的下午，从你愿意停一会儿的地方开始。";
  return {city:top.length ? top.map(r=>r.scene.city).join("、") : "暂未匹配城市",
    conclusion, story, wants};
}

const chapters = ["随手做的选择","在熟悉的地方","按自己的节奏","你想要的普通日子"];
const button = (label, action, style="secondary", extra="") =>
  `<button class="${style}" data-action="${action}" ${extra}>${label}</button>`;

function show(screen, focus=true) {
  state.screen = screen;
  save();
  topAction.hidden = screen==="home";
  topAction.textContent = screen==="review" ? "继续答题" : "查看答卷";
  topAction.dataset.action = screen==="review" ? "resume" : "review";
  if (screen==="home") {
    app.replaceChildren(byId("home").content.cloneNode(true));
    if (count()) app.querySelector(".primary").innerHTML = count()===40 ? "查看我的结果" : "继续测试 <span aria-hidden='true'>↗</span>";
  }
  if (screen==="quiz") renderQuestion();
  if (screen==="review") renderReview();
  if (screen==="result") renderResult();
  window.scrollTo(0,0);
  if (focus) app.querySelector("h1")?.focus({preventScroll:true});
}

function renderQuestion() {
  const index = state.index;
  const question = DATA.questions[index];
  const reduce = index===39 || editing;
  app.innerHTML = `<section class="page"><div class="quiz-meta"><span>${chapters[Math.floor(index/10)]}</span>
    <span>第 ${pad(index+1)} / 40 题</span></div><progress max="40" value="${count()}" aria-label="已完成题数"></progress>
    <p class="eyebrow">${index<30 ? "想想最近四周的实际做法" : "选你真正想要的普通日子"}</p>
    <h1 tabindex="-1">${escapeHtml(question.title)}</h1><div class="option-list" aria-label="单选">
      ${question.options.map((text,i)=>button(escapeHtml(text),"select","option",`data-choice="${i}" aria-pressed="${i===state.answers[index]}"`)).join("")}
    </div><div class="actions">${button(editing?"返回答卷":"上一题",editing?"review":"back","secondary",index===0&&!editing?"disabled":"")}
    ${button(editing?"保存并返回":reduce?"检查答卷":"下一题","next","primary",state.answers[index]===null?"disabled":"")}</div></section>`;
}

function renderReview() {
  const done = count();
  app.innerHTML = `<section class="page"><p class="eyebrow">已处理 ${done} / 40 题</p><h1 tabindex="-1">查看答卷</h1>
    <p class="small">点题号查看或修改。实底为已答，虚线为已跳过。</p>
    <div class="grid">${state.answers.map((value,i)=>{
      const status=value===null?"未答":value===4?"已跳过":"已答";
      return button(pad(i+1),"jump","jump",`data-index="${i}" data-status="${status}" aria-label="第 ${i+1} 题，${status}"`);
    }).join("")}</div>
    <div class="actions">${button("继续答题","resume")}${button("揭晓结果","reveal","primary",done<40?"disabled":"")}</div>
    ${done<40?`<p class="small">还有 ${40-done} 题，回答或主动跳过后可揭晓。</p>`:""}</section>`;
}

function renderResult() {
  const result = match(state.answers);
  const {top,branch,axes,active,eligible,local,alternatives} = result;
  const {city,conclusion,story,wants} = resultContent(result);
  const reason = row => {
    const hits = [...row.hits].sort((a,b)=>Number(axes[a].basis!=="wish")-Number(axes[b].basis!=="wish") ||
      row.distances[a]-row.distances[b] || a-b);
    const missing = active.filter(i=>!row.known.includes(i)).map(i=>DATA.names[i]);
    const other = row.known.filter(i=>!row.hits.includes(i) && row.scene.facts[i]);
    return `<h3>${row.scene.city}</h3><ul>${hits.map(i=>`<li><strong>${DATA.names[i]}</strong>　${axes[i].basis==="wish"?"你希望":"按日常暂估，你倾向于"}${escapeHtml(wants(i))}。${escapeHtml(row.scene.facts[i])}</li>`).join("")}</ul>
      ${other.map(i=>`<p class="boundary">你希望${escapeHtml(wants(i))}。已查到${escapeHtml(row.scene.facts[i])}</p>`).join("")}
      ${missing.length?`<p class="boundary">仍缺对应资料 · ${missing.join("、")}</p>`:""}
      <p class="boundary">${escapeHtml(row.scene.boundary)}</p>`;
  };
  const artSource = byId("scene-art").getAttribute("src");
  app.innerHTML = `<article class="page result"><section class="ticket">
    <div class="ticket-head"><p class="eyebrow">${branch}</p><h1 tabindex="-1">${city}</h1></div>
    <div class="art-gallery">${resultArtwork(top).map(art=>`<figure class="art-tile" style="--column:${art.column};--row:${art.row}">
      <img src="${artSource}" alt=""><figcaption>${art.caption}</figcaption></figure>`).join("")}</div>
    <div class="ticket-conclusion"><h2>你的专属结论</h2><p>${escapeHtml(conclusion)}</p></div></section>
    <section class="panel"><h2>城市场景</h2>${top.length?top.map(r=>`<h3>${r.scene.city} · ${r.scene.name}</h3><p>${escapeHtml(r.scene.story)}</p>`).join(""):`<p>${escapeHtml(story)}</p>`}</section>
    <section class="panel"><h2>为什么合拍</h2>${top.length?top.map(reason).join(""):`<p>${eligible?
      "目前的资料未能接住这份答卷里的取舍。可以先把上面的生活画像当作下次出门的线索。":
      `这次有 ${active.length} 项偏好可比较。城市匹配至少需要 4 项，其中 2 项有明确期待。`}</p>`}
      ${local.filter(r=>!top.some(t=>t.scene.city_id===r.scene.city_id)).map(r=>`<p class="boundary">局部线索 · ${r.scene.city}。${r.hits.map(i=>r.scene.facts[i]).join("")}${r.scene.boundary}</p>`).join("")}
      ${alternatives.map(r=>{
        const i = r.scene.levels.findIndex((menu,j)=>menu.length && top[0].scene.levels[j].length && menu.join()!==top[0].scene.levels[j].join());
        return `<p class="boundary">另一个合格去处 · ${r.scene.city}。${r.scene.facts[i]}</p>`;
      }).join("")}</section>
    <div class="actions">${button("回改答案","review")}${button("生成分享卡","share","primary")}</div>
    <div class="actions">${button("再测一次","restart","plain")}</div></article>`;
}

function wrap(ctx, text, width) {
  const lines = [];
  let line = "";
  const tokens = text.match(/(?:[A-Za-z0-9]+(?:[.–-][A-Za-z0-9]+)*|[^\n])[，。！？、：」）》]*/gu) ?? [];
  for (const token of tokens) {
    if (line && ctx.measureText(line+token).width > width) {
      lines.push(line.trimEnd());
      line = token.trimStart();
    } else if (line || token.trim()) {
      line += token;
    }
  }
  if (line) lines.push(line.trimEnd());
  return lines;
}

function drawPostmark(ctx) {
  ctx.save();
  ctx.translate(744,134);
  ctx.rotate(-0.12);
  ctx.strokeStyle="#a34b35";
  ctx.lineWidth=2;
  for (const radius of [53,45]) {
    ctx.beginPath();
    ctx.arc(0,0,radius,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.fillStyle="#a34b35";
  ctx.textAlign="center";
  ctx.font="bold 20px sans-serif";
  ctx.fillText("城市日常",0,6);
  for (const y of [-18,0,18]) {
    ctx.beginPath();
    ctx.moveTo(54,y);
    ctx.bezierCurveTo(66,y-6,76,y+8,93,y);
    ctx.stroke();
  }
  ctx.restore();
}

async function shareCard() {
  const result = match(state.answers);
  const {city,conclusion,story} = resultContent(result);
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width=900;
  const art = resultArtwork(result.top);
  const atlas = byId("scene-art");
  let hasArtwork = true;
  try { await atlas.decode(); } catch { hasArtwork = false; }
  const left = 66, contentWidth = 768, gap = 22, photoTop = 245;
  const photoHeight = hasArtwork ? (art.length === 1 ? 377 : 265) : 0;
  const columns = Math.min(art.length, 2);
  const tileWidth = (contentWidth-gap*(columns-1))/columns;
  const captionFont = "31px sans-serif";
  const conclusionFont = "37px serif";
  ctx.font=captionFont;
  const tiles = art.map((tile,i)=>{
    const source = result.top[i]?.scene.story ?? story;
    const sentence = source.match(/^[^。！？]+[。！？]?/u)?.[0] ?? source;
    return {...tile, lines:wrap(ctx,sentence,tileWidth-24)};
  });
  const rows = [];
  for (let i=0; i<tiles.length; i+=columns) {
    rows.push(tiles.slice(i,i+columns));
  }
  const rowHeight = row => photoHeight+84+Math.max(...row.map(tile=>tile.lines.length))*43;
  const conclusionTop = photoTop+rows.reduce((height,row)=>height+rowHeight(row),0)+24;
  ctx.font=conclusionFont;
  const main = wrap(ctx,conclusion,contentWidth);
  canvas.height=conclusionTop+66+main.length*53+50;
  ctx.fillStyle="#f7efdc";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth=6;
  ctx.strokeStyle="#2d554c";
  ctx.strokeRect(18,18,864,canvas.height-36);
  ctx.lineWidth=1;
  ctx.strokeStyle="#aa9c80";
  ctx.strokeRect(31,31,838,canvas.height-62);
  drawPostmark(ctx);
  ctx.fillStyle="#2d554c";
  ctx.font="24px sans-serif";
  ctx.fillText("测你的专属城市 CP",left,80);
  ctx.fillStyle="#a34b35";
  ctx.font="bold 25px sans-serif";
  ctx.fillText(result.branch,left,131);
  ctx.fillStyle="#16382e";
  ctx.font="bold 66px serif";
  ctx.fillText(city,left,205,contentWidth-148);

  let rowTop = photoTop;
  for (const row of rows) {
    row.forEach((tile,i)=>{
      const x = left+i*(tileWidth+gap);
      if (hasArtwork) {
        const cellWidth = atlas.naturalWidth/2, cellHeight = atlas.naturalHeight/2;
        const scale = Math.max(tileWidth/cellWidth,photoHeight/cellHeight);
        const cropWidth = tileWidth/scale;
        const cropHeight = photoHeight/scale;
        ctx.drawImage(atlas,tile.column*cellWidth+(cellWidth-cropWidth)/2,
          tile.row*cellHeight+(cellHeight-cropHeight)/2,cropWidth,cropHeight,x,rowTop,tileWidth,photoHeight);
      }
      ctx.fillStyle="#efe4ca";
      ctx.fillRect(x,rowTop+photoHeight,tileWidth,rowHeight(row)-16-photoHeight);
      ctx.fillStyle="#934833";
      ctx.font="bold 24px sans-serif";
      ctx.fillText(tile.caption,x+12,rowTop+photoHeight+34,tileWidth-24);
      ctx.fillStyle="#263e33";
      ctx.font=captionFont;
      tile.lines.forEach((line,j)=>ctx.fillText(line,x+12,rowTop+photoHeight+76+j*43));
    });
    rowTop+=rowHeight(row);
  }
  ctx.strokeStyle="#a89473";
  ctx.setLineDash([5,6]);
  ctx.beginPath();
  ctx.moveTo(left,conclusionTop-11);
  ctx.lineTo(left+contentWidth,conclusionTop-11);
  ctx.stroke();
  ctx.fillStyle="#934833";
  ctx.font="bold 24px sans-serif";
  ctx.fillText("你的专属结论",left,conclusionTop+27);
  ctx.fillStyle="#16382e";
  ctx.font=conclusionFont;
  main.forEach((line,i)=>ctx.fillText(line,left,conclusionTop+79+i*53));
  shareBlob = await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
  if (!shareBlob) { byId("share-status").textContent="暂时无法生成图片，可以重试。";return; }
  if (shareUrl) URL.revokeObjectURL(shareUrl);
  shareUrl=URL.createObjectURL(shareBlob);
  byId("card").src=shareUrl;
  byId("save-card").disabled=false;
  byId("native-share").hidden=!navigator.canShare?.({files:[shareFile()]});
  byId("share-status").textContent="";
}

const shareFile = ()=>new File([shareBlob],"我的城市CP.png",{type:"image/png"});
byId("close-share").onclick=()=>dialog.close();
dialog.addEventListener("close",()=>shareTrigger?.focus());
byId("save-card").onclick=()=>{
  if (!shareUrl) return;
  const link=document.createElement("a");
  link.href=shareUrl; link.download="我的城市CP.png"; link.click();
  byId("share-status").textContent="若浏览器没有下载，可长按上方图片保存。";
};
byId("native-share").onclick=async()=>{
  try { await navigator.share({files:[shareFile()], title:"我的城市 CP"}); }
  catch(error) { if(error.name!=="AbortError") byId("share-status").textContent="可用「保存图片」继续分享。"; }
};

document.addEventListener("click",event=>{
  const control=event.target.closest("[data-action]");
  if (!control) return;
  switch(control.dataset.action) {
    case "start": show(count()===40?"result":"quiz"); break;
    case "select":
      state.answers[state.index]=Number(control.dataset.choice);
      save();
      app.querySelectorAll("[data-action='select']").forEach(item=>item.setAttribute("aria-pressed",String(item===control)));
      app.querySelector("[data-action='next']").disabled=false;
      break;
    case "next":
      if(state.answers[state.index]===null) break;
      if(editing || state.index===39) {editing=false;show("review");}
      else {state.index++;show("quiz");}
      break;
    case "back": state.index=Math.max(0,state.index-1);show("quiz");break;
    case "review": editing=false;show("review");break;
    case "jump": state.index=Number(control.dataset.index);editing=true;show("quiz");break;
    case "resume":
      editing=false;
      if(count()===40) show("result");
      else {state.index=state.answers.indexOf(null);show("quiz");}
      break;
    case "reveal": if(count()===40) show("result");break;
    case "restart":
      if(window.confirm("清空这次答卷，重新开始？")) {state=blank();editing=false;show("home");}
      break;
    case "share":
      shareTrigger=control;
      byId("save-card").disabled=true;
      byId("native-share").hidden=true;
      byId("card").removeAttribute("src");
      byId("share-status").textContent="正在生成图片…";
      dialog.showModal();
      shareCard().catch(()=>{byId("share-status").textContent="图片生成失败，请关闭后重试。";});
      break;
  }
});
show("home",false);
</script>
</body></html>
